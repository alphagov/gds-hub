services:
  app:
    build:
      context: .
      args:
        APP_VERSION: local
    ports:
      - "127.0.0.1:${APP_HOST_PORT:-3000}:3000"
    environment:
      PORT: "3000"
      LOG_LEVEL: info
      DATABASE_URL: postgres://gdshub:gdshub@db:5432/gdshub
      # Both are blank (editing off) unless set in your shell or in .env.
      # The app is built with NODE_ENV=production, so test mode needs both.
      EDIT_MODE: ${EDIT_MODE:-}
      ALLOW_UNAUTHENTICATED_EDITING: ${ALLOW_UNAUTHENTICATED_EDITING:-}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine@sha256:0115267ab5a509022df9319c77be365cef335adb71556c75f60f5360ee247e71
    environment:
      POSTGRES_USER: gdshub
      POSTGRES_PASSWORD: gdshub
      POSTGRES_DB: gdshub
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-5432}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gdshub -d gdshub"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  db-data:
